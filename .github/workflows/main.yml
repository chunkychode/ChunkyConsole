name: Push to nuget

on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v1
    - name: Get version from tag
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
    - name: Clean old packages
      run: rm -f ChunkyConsole*.nupk      
    - name: Build
      run: dotnet build ChunkyConsole/ChunkyConsole.csproj -c Release
    - name: Pack nugets
      run: dotnet pack ChunkyConsole/ChunkyConsole.csproj -c Release --no-build -p:Version=${{ env.VERSION }} --output .
    - name: Push to NuGet
      run: dotnet nuget push "ChunkyConsole*.nupkg" --api-key ${{secrets.NUGETAPI}} --source https://api.nuget.org/v3/index.json
